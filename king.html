<!DOCTYPE html>
<html>
<head>
    <title>Cafe Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            margin: 0;
            text-align: center;
        }

        h1 {
            background-color: #6f4e37;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .tagline {
            color: #6f4e37;
            font-size: 18px;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .item {
            background-color: white;
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        h2 {
            color: #6f4e37;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>☕ My Cafe Menu</h1>
    <p class="tagline">Fresh Food, Fresh Taste!</p>

    <div class="menu">

        <div class="item">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80"
                 alt="Coffee">
            <h2>Coffee</h2>
            <p class="price">₹80</p>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80"

        </div>

                 alt="Pizza">
            <h2>Pizza</h2>
            <p class="price">₹180</p>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=500&q=80"
                 alt="Sandwich">
            <h2>Sandwich</h2>
            <p class="price">₹100</p>
        </div>

    </div>

</body>
</html>
